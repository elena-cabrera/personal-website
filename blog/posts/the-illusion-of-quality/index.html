<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@450;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const useDark = stored ? stored === 'dark' : prefersDark;
          const root = document.documentElement;
          root.classList.toggle('dark', useDark);
        } catch (e) {
          // no-op
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["Geist Mono", "ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
            },
          },
        },
      };
    </script>
    <title id="blog-title">Blog Post - Elena's blog</title>
    <link rel="icon" type="image/png" href="/assets/images/profile/memoji.png" />
    <link rel="stylesheet" href="/css/typography.css" />
    <style>
      .theme-toggle {
        display: grid;
        place-items: center;
        cursor: pointer;
        line-height: 1;
        padding: 0.25rem;
      }
      .theme-toggle input {
        display: none;
      }
      .theme-toggle .icon {
        grid-column: 1 / 1;
        grid-row: 1 / 1;
        transition: transform 500ms;
        line-height: 0.1;
      }
      .theme-toggle .icon--sun {
        transition-delay: 200ms;
        color: currentColor;
      }
      .theme-toggle .icon--moon {
        transform: scale(0);
        color: currentColor;
      }
      .theme-toggle input:checked + .icon--sun {
        transform: rotate(360deg) scale(0);
      }
      .theme-toggle input:checked ~ .icon--moon {
        transition-delay: 200ms;
        transform: scale(1) rotate(360deg);
      }
      body {
        font-weight: 450;
      }
      p {
        letter-spacing: -0.01em;
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="ce25274f-3090-403d-bd0b-c6d649ff1d8b"></script>
  </head>
  <body class="bg-white text-gray-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors" data-show-back-button="true">
    <div data-component="nav"></div>
    <main class="px-4 py-12 flex flex-col gap-12 max-w-[46rem] mx-auto">
      <article>
        <header class="mb-8">
          <h1 id="blog-post-title" class="text-3xl font-semibold text-gray-900 dark:text-white transition-colors mb-4">
          </h1>
          <div class="flex flex-wrap items-center gap-4 mb-4">
            <p id="blog-post-date" class="text-sm text-gray-600 dark:text-zinc-400 font-medium tracking-wide transition-colors">
            </p>
            <span id="blog-post-category" class="border border-zinc-800 dark:border-zinc-700 px-2 py-1 transition-colors text-sm">
            </span>
          </div>
        </header>

        <div id="blog-post-content">
          <!-- Content will be inserted here -->
        </div>
      </article>
    </main>

    <div data-component="footer"></div>
    <div data-component="theme-toggle"></div>
    <script src="/js/components.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/blog-renderer.js"></script>
    <script src="/js/click-sound.js"></script>
  </body>
</html>
