<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="semafor preview">
  <title>semafor - Know when your Mac is on fire</title>
  <defs>
    <clipPath id="logo-clip">
      <circle cx="28" cy="28" r="28" />
    </clipPath>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#151515" flood-opacity="0.14" />
    </filter>
    <linearGradient id="cpu-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A314" />
      <stop offset="100%" stop-color="#ED4038" />
    </linearGradient>
    <linearGradient id="ram-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EB861" />
      <stop offset="100%" stop-color="#4FD67E" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="#FFFFFF" />

  <!-- Stylized macOS menu bar -->
  <rect x="0" y="0" width="1600" height="54" fill="#F6F6F6" />
  <rect x="0" y="54" width="1600" height="1" fill="#E6E6E6" />
  <!-- traffic-light window dots (decorative) -->
  <circle cx="28" cy="27" r="7" fill="#ED4038" />
  <circle cx="52" cy="27" r="7" fill="#F5A314" />
  <circle cx="76" cy="27" r="7" fill="#2EB861" />
  <text x="110" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#151515">Semafor</text>
  <text x="190" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B">File</text>
  <text x="230" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B">Edit</text>
  <text x="272" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B">View</text>
  <!-- menu-bar status cluster -->
  <circle cx="1438" cy="27" r="7" fill="#F5A314" />
  <text x="1454" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#151515">Busy</text>
  <text x="1518" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6B6B6B">9:41</text>

  <!-- Brand header -->
  <g transform="translate(96, 118)">
    <g clip-path="url(#logo-clip)">
      <g transform="rotate(30 28 28)">
        <rect x="-20" y="-20" width="36" height="100" fill="#ED4038" />
        <rect x="20" y="-20" width="18" height="100" fill="#F5A314" />
        <rect x="42" y="-20" width="36" height="100" fill="#2EB861" />
      </g>
    </g>
    <text x="72" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="500" fill="#151515">semafor</text>
    <!-- CTA pill -->
    <rect x="1188" y="4" width="172" height="48" rx="24" fill="#151515" />
    <text x="1274" y="35" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF">Get for Mac</text>
  </g>

  <!-- Hero copy -->
  <text x="96" y="310" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="600" fill="#151515">Know when your</text>
  <text x="96" y="396" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="600" fill="#151515">Mac is on fire.</text>
  <text x="96" y="468" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="400" fill="#6B6B6B">Menu bar traffic lights for CPU and memory.</text>

  <!-- State legend -->
  <g transform="translate(96, 530)">
    <circle cx="10" cy="0" r="10" fill="#2EB861" />
    <text x="30" y="6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#151515">Chill</text>
    <circle cx="140" cy="0" r="10" fill="#F5A314" />
    <text x="160" y="6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#151515">Busy</text>
    <circle cx="270" cy="0" r="10" fill="#ED4038" />
    <text x="290" y="6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#151515">Too hot</text>
  </g>

  <!-- Floating dropdown panel -->
  <g transform="translate(980, 250)" filter="url(#panel-shadow)">
    <rect width="460" height="460" rx="28" fill="#FFFFFF" stroke="#EDEDED" stroke-width="1" />
    <!-- Busy header -->
    <circle cx="48" cy="56" r="12" fill="#F5A314" />
    <text x="76" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600" fill="#151515">Busy</text>

    <!-- CPU -->
    <text x="40" y="130" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#151515">CPU</text>
    <text x="420" y="130" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#151515">72%</text>
    <rect x="40" y="148" width="380" height="14" rx="7" fill="#EEEEEE" />
    <rect x="40" y="148" width="274" height="14" rx="7" fill="url(#cpu-fill)" />
    <text x="40" y="188" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#8A8A8A">5.8 of 8 cores</text>
    <text x="420" y="188" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#F5A314">load 7.4</text>

    <!-- RAM -->
    <text x="40" y="250" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#151515">RAM</text>
    <text x="420" y="250" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#151515">54%</text>
    <rect x="40" y="268" width="380" height="14" rx="7" fill="#EEEEEE" />
    <rect x="40" y="268" width="205" height="14" rx="7" fill="url(#ram-fill)" />
    <text x="40" y="308" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#8A8A8A">17.3 GB of 32 GB</text>

    <!-- Top processes -->
    <text x="40" y="360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#151515">Top processes</text>
    <text x="40" y="400" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="400" fill="#6B6B6B">Safari</text>
    <text x="420" y="400" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#151515">48%</text>
    <text x="40" y="434" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="400" fill="#6B6B6B">Mail</text>
    <text x="420" y="434" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="500" fill="#151515">21%</text>
  </g>
</svg>
